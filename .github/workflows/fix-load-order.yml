name: Fix Angel load order
on:
  push:
    paths:
      - '.github/workflows/fix-load-order.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app script order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          old='''<script src="social-v2.js"></script>\n<script src="supabase-config.js"></script>\n<script src="supabase-backend.js"></script>'''
          new='''<script src="supabase-config.js?v=20260820-2230"></script>\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script src="supabase-backend.js?v=20260820-2230"></script>\n<script src="social-v2.js?v=20260820-2230"></script>'''
          if old in s:
              s=s.replace(old,new)
          else:
              s=s.replace('<script src="social-v2.js"></script>','')
              s=s.replace('<script src="supabase-config.js"></script>','')
              s=s.replace('<script src="supabase-backend.js"></script>','')
              s=s.replace('</body>',new+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Fix Angel script load order" || exit 0
          git push