name: Connect Angel Supabase auth
on:
  push:
    paths:
      - '.github/workflows/connect-supabase-auth.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write backend and attach
        run: |
          printf '%s%s%s' '' '' '' | base64 -d > supabase-backend.js
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          tags='<script src="supabase-config.js"></script>\n<script src="supabase-backend.js"></script>'
          if 'supabase-backend.js' not in s:
              s=s.replace('</body>',tags+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html supabase-backend.js
          git commit -m "Connect Angel profile auth to Supabase"
          git push