name: Bump Angel auth cache
on:
  push:
    paths:
      - '.github/workflows/bump-auth-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('supabase-backend.js?v=20260820-2230','supabase-backend.js?v=20260820-2231')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Bump auth cache for 6-char login" || exit 0
          git push