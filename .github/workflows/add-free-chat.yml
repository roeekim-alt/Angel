name: Add free chat to Angel

on:
  push:
    paths:
      - '.github/workflows/add-free-chat.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch free chat UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_css='''.learn-quote{background:#FFF8E9;border:1px solid #F3DFAC;border-radius:16px;padding:14px;margin-top:14px;font-weight:600}\n\n.disclaimer'''
          new_css='''.learn-quote{background:#FFF8E9;border:1px solid #F3DFAC;border-radius:16px;padding:14px;margin-top:14px;font-weight:600}\n\n.hero-chat{width:100%;min-height:50px;border-radius:16px;margin-top:10px;border:1px solid rgba(255,255,255,.24);color:#fff;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}\n.chat-list{display:grid;gap:10px;margin-top:14px}\n.chat-person{width:100%;display:flex;align-items:center;gap:12px;text-align:right;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}\n.chat-person .online-dot{width:9px;height:9px;border-radius:999px;background:var(--grass);display:inline-block;margin-inline-start:5px}\n.chat-screen{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;max-width:440px;margin:0 auto}\n.chat-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px}\n.chat-head button{width:42px;height:42px;border-radius:14px;background:#F2F4FB;display:grid;place-items:center}\n.chat-messages{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px}\n.bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}\n.bubble.me{align-self:flex-start;background:var(--ink);color:#fff;border-bottom-left-radius:5px}\n.bubble.them{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-bottom-right-radius:5px}\n.chat-compose{background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}\n.chat-compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;color:var(--ink);background:#F8F9FE}\n.chat-compose button{width:48px;border-radius:16px;background:var(--halo);color:#33270B;display:grid;place-items:center}\n\n.disclaimer'''
          assert old_css in s, 'CSS anchor not found'
          s=s.replace(old_css,new_css,1)

          old_state='''  afterId:null, afterSent:false, learnId:null, available:true, tick:0, wait:0\n};'''
          new_state='''  afterId:null, afterSent:false, learnId:null, available:true, tick:0, wait:0,\n  freeChat:false, chatUser:null, chatMessages:{}\n};'''
          assert old_state in s, 'state anchor not found'
          s=s.replace(old_state,new_state,1)

          old_hero='''    '<button class="cta press" data-act="hero">'+ic('phone',20)+'שלחו לי מלאך</button>'+\n    '<p class="note">אנונימי · בלי הרשמה · בלי שאלות מיותרות</p>'+'''
          new_hero='''    '<button class="cta press" data-act="hero">'+ic('phone',20)+'שלחו לי מלאך</button>'+\n    '<button class="hero-chat press" data-act="free-chat">'+ic('msg',19)+'צ׳אט חופשי עם מי שמחובר עכשיו</button>'+\n    '<p class="note">אנונימי · בלי הרשמה · בלי שאלות מיותרות</p>'+'''
          assert old_hero in s, 'hero anchor not found'
          s=s.replace(old_hero,new_hero,1)

          nav_anchor='''function navHTML(){'''
          chat_code=r'''function freeChatHTML(){
  var online = ANGELS.filter(function(p){return p.online;});
  if (!S.chatUser){
    return '<div class="chat-screen"><div class="chat-head">'+
      '<button class="soft" data-act="chat-back" aria-label="חזרה">'+ic('arrowRight',22)+'</button>'+
      '<div><h3 class="display" style="font-size:20px">צ׳אט חופשי</h3>'+
      '<p class="small muted" style="margin:0">'+online.length+' אנשים מחוברים עכשיו</p></div></div>'+
      '<div style="padding:16px;overflow-y:auto"><p class="small muted" style="margin:0">בחר/י מישהו ופשוט התחילו לדבר. בלי טופס ובלי שיחת טלפון.</p>'+
      '<div class="chat-list">'+online.map(function(p){
        return '<button class="chat-person soft" data-act="chat-user" data-id="'+p.id+'">'+avatar(p,46)+
          '<span style="flex:1"><b>'+esc(p.name)+'</b><span class="small muted" style="display:block">'+esc(p.been)+'</span></span>'+
          '<span class="small" style="color:var(--grass)"><i class="online-dot"></i>מחובר/ת</span></button>';
      }).join('')+'</div></div></div>';
  }
  var p = byId(S.chatUser);
  var msgs = S.chatMessages[S.chatUser] || [
    {from:'them',text:'היי, אני כאן. אפשר לדבר על מה שבא לך.'}
  ];
  return '<div class="chat-screen"><div class="chat-head">'+
    '<button class="soft" data-act="chat-list" aria-label="חזרה לרשימה">'+ic('arrowRight',22)+'</button>'+avatar(p,42)+
    '<div style="flex:1"><b>'+esc(p.name)+'</b><span class="small" style="display:block;color:var(--grass)">מחובר/ת עכשיו</span></div></div>'+
    '<div class="chat-messages">'+msgs.map(function(m){return '<div class="bubble '+(m.from==='me'?'me':'them')+'">'+esc(m.text)+'</div>';}).join('')+'</div>'+
    '<div class="chat-compose"><input id="chatInput" type="text" autocomplete="off" placeholder="כתבו משהו…" aria-label="הודעה">'+
    '<button class="press" data-act="chat-send" aria-label="שליחה">'+ic('msg',20)+'</button></div></div>';
}

'''
          assert nav_anchor in s, 'nav anchor not found'
          s=s.replace(nav_anchor,chat_code+nav_anchor,1)

          old_render='''    '<main class="wrap">'+screen+'</main>'+navHTML()+sheetHTML()+\n    (S.matching?matchingHTML():"")+(S.callId?callHTML():"");'''
          new_render='''    '<main class="wrap">'+screen+'</main>'+navHTML()+sheetHTML()+\n    (S.matching?matchingHTML():"")+(S.callId?callHTML():"")+(S.freeChat?freeChatHTML():"");'''
          assert old_render in s, 'render anchor not found'
          s=s.replace(old_render,new_render,1)

          old_handlers='''  else if (act==="hero"){ S.sheet="triage"; }\n  else if (act==="learn"){ S.learnId=id; S.sheet="learn"; }'''
          new_handlers='''  else if (act==="hero"){ S.sheet="triage"; }\n  else if (act==="free-chat"){ S.freeChat=true; S.chatUser=null; }\n  else if (act==="chat-back"){ S.freeChat=false; S.chatUser=null; }\n  else if (act==="chat-list"){ S.chatUser=null; }\n  else if (act==="chat-user"){ S.chatUser=+id; }\n  else if (act==="chat-send"){\n    var input=document.getElementById("chatInput"), text=input?input.value.trim():"";\n    if(text && S.chatUser){\n      if(!S.chatMessages[S.chatUser]) S.chatMessages[S.chatUser]=[{from:"them",text:"היי, אני כאן. אפשר לדבר על מה שבא לך."}];\n      S.chatMessages[S.chatUser].push({from:"me",text:text});\n    }\n  }\n  else if (act==="learn"){ S.learnId=id; S.sheet="learn"; }'''
          assert old_handlers in s, 'handler anchor not found'
          s=s.replace(old_handlers,new_handlers,1)

          old_escape='''  if (e.key === "Escape" && S.sheet){ S.sheet=null; S.afterId=null; S.afterSent=false; render(); }'''
          new_escape='''  if (e.key === "Escape" && S.freeChat){ S.freeChat=false; S.chatUser=null; render(); return; }\n  if (e.key === "Enter" && e.target && e.target.id === "chatInput"){\n    var text=e.target.value.trim();\n    if(text && S.chatUser){\n      if(!S.chatMessages[S.chatUser]) S.chatMessages[S.chatUser]=[{from:"them",text:"היי, אני כאן. אפשר לדבר על מה שבא לך."}];\n      S.chatMessages[S.chatUser].push({from:"me",text:text}); render();\n    }\n    return;\n  }\n  if (e.key === "Escape" && S.sheet){ S.sheet=null; S.afterId=null; S.afterSent=false; render(); }'''
          assert old_escape in s, 'keydown anchor not found'
          s=s.replace(old_escape,new_escape,1)

          # icon name fallback: arrowRight is not guaranteed in the icon map
          s=s.replace("ic('arrowRight',22)","ic('chev',22)")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add free chat with online users"
          git push
