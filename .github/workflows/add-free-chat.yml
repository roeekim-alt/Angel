name: Add free chat to Angel

on:
  push:
    paths:
      - '.github/workflows/add-free-chat.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add free chat overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'ANGEL_FREE_CHAT_V2' not in s:
              css = r'''
<style id="angel-free-chat-style">
.hero-chat-v2{width:100%;min-height:50px;border-radius:16px;margin-top:10px;border:1px solid rgba(255,255,255,.24);color:#fff;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.freechat-v2{position:fixed;inset:0;z-index:80;background:#EDF0FA;max-width:440px;margin:0 auto;display:flex;flex-direction:column;color:#1F2749;font-family:'Assistant',system-ui,sans-serif}
.freechat-v2-head{background:#fff;border-bottom:1px solid #DDE2F2;padding:14px 16px;display:flex;align-items:center;gap:12px}
.freechat-v2-back{width:42px;height:42px;border:0;border-radius:14px;background:#F2F4FB;font:inherit;font-weight:700;cursor:pointer}
.freechat-v2-body{flex:1;overflow:auto;padding:16px}
.freechat-v2-list{display:grid;gap:10px;margin-top:14px}
.freechat-v2-user{width:100%;border:1px solid #DDE2F2;border-radius:18px;background:#fff;padding:14px;display:flex;align-items:center;gap:12px;text-align:right;font:inherit;color:#1F2749;cursor:pointer}
.freechat-v2-avatar{width:46px;height:46px;border-radius:15px;background:#EEF1FB;display:grid;place-items:center;font-weight:700;flex:none}
.freechat-v2-dot{width:9px;height:9px;border-radius:999px;background:#2FA37C;display:inline-block;margin-left:5px}
.freechat-v2-messages{display:flex;flex-direction:column;gap:10px}
.freechat-v2-bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.freechat-v2-bubble.me{align-self:flex-start;background:#1F2749;color:#fff}
.freechat-v2-bubble.them{align-self:flex-end;background:#fff;border:1px solid #DDE2F2}
.freechat-v2-compose{background:#fff;border-top:1px solid #DDE2F2;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.freechat-v2-compose input{flex:1;min-width:0;border:1px solid #DDE2F2;border-radius:16px;padding:12px 14px;font:inherit}
.freechat-v2-compose button{width:58px;border:0;border-radius:16px;background:#FFC24D;color:#33270B;font:inherit;font-weight:700;cursor:pointer}
</style>
'''
              js = r'''
<script id="ANGEL_FREE_CHAT_V2">
(function(){
  var selected=null, messages={};
  function onlineUsers(){ return (window.ANGELS||[]).filter(function(p){return p.online;}); }
  function esc2(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function injectButton(){
    var hero=document.querySelector('.hero');
    if(!hero || hero.querySelector('[data-free-chat-v2]')) return;
    var note=hero.querySelector('.note');
    var b=document.createElement('button');
    b.className='hero-chat-v2 press';
    b.setAttribute('data-free-chat-v2','1');
    b.innerHTML='💬 צ׳אט חופשי עם מי שמחובר עכשיו';
    b.addEventListener('click',function(){ selected=null; openChat(); });
    hero.insertBefore(b,note||null);
  }
  function openChat(){
    var old=document.getElementById('freechat-v2'); if(old) old.remove();
    var root=document.createElement('div'); root.id='freechat-v2'; root.className='freechat-v2';
    if(!selected){
      var users=onlineUsers();
      root.innerHTML='<div class="freechat-v2-head"><button class="freechat-v2-back" id="fcClose">‹</button><div><b style="font-size:20px">צ׳אט חופשי</b><div style="font-size:14px;color:#5A648C">'+users.length+' מחוברים עכשיו</div></div></div><div class="freechat-v2-body"><div style="font-size:14px;color:#5A648C">בחר/י מישהו ופשוט התחילו לדבר. בלי טופס ובלי שיחת טלפון.</div><div class="freechat-v2-list">'+users.map(function(p){return '<button class="freechat-v2-user" data-fc-user="'+p.id+'"><span class="freechat-v2-avatar">'+esc2(p.ini)+'</span><span style="flex:1"><b>'+esc2(p.name)+'</b><span style="display:block;font-size:14px;color:#5A648C">'+esc2(p.been)+'</span></span><span style="font-size:13px;color:#2FA37C"><i class="freechat-v2-dot"></i>מחובר/ת</span></button>';}).join('')+'</div></div>';
      document.body.appendChild(root);
      document.getElementById('fcClose').onclick=function(){root.remove();};
      root.querySelectorAll('[data-fc-user]').forEach(function(btn){btn.onclick=function(){selected=+btn.getAttribute('data-fc-user');openChat();};});
      return;
    }
    var p=(window.ANGELS||[]).filter(function(x){return x.id===selected;})[0];
    if(!p){ selected=null; openChat(); return; }
    if(!messages[selected]) messages[selected]=[{from:'them',text:'היי, אני כאן. אפשר לדבר חופשי.'}];
    root.innerHTML='<div class="freechat-v2-head"><button class="freechat-v2-back" id="fcList">‹</button><span class="freechat-v2-avatar" style="width:42px;height:42px">'+esc2(p.ini)+'</span><div><b>'+esc2(p.name)+'</b><div style="font-size:14px;color:#2FA37C">מחובר/ת עכשיו</div></div></div><div class="freechat-v2-body"><div class="freechat-v2-messages">'+messages[selected].map(function(m){return '<div class="freechat-v2-bubble '+(m.from==='me'?'me':'them')+'">'+esc2(m.text)+'</div>';}).join('')+'</div></div><div class="freechat-v2-compose"><input id="fcInput" placeholder="כתבו משהו…" autocomplete="off"><button id="fcSend">שלח</button></div>';
    document.body.appendChild(root);
    document.getElementById('fcList').onclick=function(){selected=null;openChat();};
    function send(){var inp=document.getElementById('fcInput');var t=inp.value.trim();if(!t)return;messages[selected].push({from:'me',text:t});openChat();setTimeout(function(){var i=document.getElementById('fcInput');if(i)i.focus();},0);}
    document.getElementById('fcSend').onclick=send;
    document.getElementById('fcInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
    document.getElementById('fcInput').focus();
  }
  new MutationObserver(injectButton).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',injectButton); else injectButton();
})();
</script>
'''
              s = s.replace('</head>', css + '</head>', 1)
              s = s.replace('</body>', js + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add free chat with online users"
          git push
