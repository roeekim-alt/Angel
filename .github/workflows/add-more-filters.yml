name: Add extended Angel filters

on:
  push:
    paths:
      - '.github/workflows/add-more-filters.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch filters
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add post trauma, combat stress and support filters"
          git push
