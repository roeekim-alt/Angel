<title>אנג'ל — המלאך השומר שלך</title>
<meta name="description" content="קו הקשבה 24/7. אנשים שעברו את זה, זמינים לדבר איתך עכשיו." />

<style>
/* ------------------------------------------------------------------
   אנג'ל — המלאך השומר שלך
   Single-file prototype. No build tools, no frameworks.

   HUMOR POLICY (deliberate, not decorative):
   Humor lives in the ambient layer — hero, "where I am today" lines,
   waiting states, empty states, the listener's own space.
   Humor NEVER appears in: the crisis branch of triage, the emergency
   sheet, or the in-call guidance. There the voice goes plain and steady.
-------------------------------------------------------------------*/
:root{
  --bg:#EDF0FA; --surface:#fff; --ink:#1F2749; --ink-soft:#5A648C;
  --line:#DDE2F2; --halo:#FFC24D; --halo-deep:#D98E0E;
  --grass:#2FA37C; --rose:#EE6E8C; --lilac:#8E86E0; --blue:#4E8FE0;
  --night:linear-gradient(170deg,#28315E,#4C4A90);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Assistant',system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5;
}
.display{font-family:'Suez One','Assistant',serif;font-weight:400;letter-spacing:-.01em;margin:0}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
svg{display:block;flex:none}

.wrap{max-width:440px;margin:0 auto;padding:0 16px calc(112px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.press{transition:transform .14s ease}
.press:active{transform:scale(.97)}
.soft{transition:opacity .14s ease}
.soft:active{opacity:.65}
.muted{color:var(--ink-soft)}
.small{font-size:14px}
.xs{font-size:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px}
.sos{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;
  background:#FFE9EE;color:#BE3A5A;font-weight:600;font-size:13px}

/* hero */
.hero{border-radius:26px;padding:20px;color:#fff;background:var(--night)}
.halos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.halos i{width:18px;height:18px;border-radius:999px;border:2px solid rgba(255,255,255,.14)}
.halos i.lit{border-color:var(--halo);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
.hero h2{font-size:27px;line-height:1.2;margin:4px 0 12px}
.hero .count{color:var(--halo);font-size:14px;margin:0}
#ticker{color:#B7BDE4;font-size:14px;min-height:42px;margin:0 0 16px;animation:fade .5s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cta{width:100%;min-height:56px;border-radius:18px;background:var(--halo);color:#33270B;
  font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.hero .note{text-align:center;font-size:12px;color:#A2AAD6;margin:8px 0 0}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px 16px;margin:0 -16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;
  font-weight:600;background:var(--surface);color:var(--ink-soft);border:1px solid var(--line)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.card-head{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right}
.name{font-weight:700;font-size:16px}
.been{font-size:14px;line-height:1.35;margin:2px 0 0}
.where{font-size:14px;line-height:1.35;color:var(--ink-soft);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;
  font-size:12px;font-weight:600;background:#F2F4FB;color:var(--ink-soft)}
.actions{display:flex;gap:8px;margin-top:12px}
.btn-dark{flex:1;min-height:46px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-icon{width:52px;min-height:46px;border-radius:14px;background:#F2F4FB;display:grid;place-items:center}
.btn-dark[disabled],.btn-icon[disabled]{background:#EFF1F8;color:#A0A8C4;cursor:default}

/* avatar */
.av{position:relative;flex:none}
.av .face{width:100%;height:100%;display:grid;place-items:center;font-weight:700;border-radius:32%}
.av .halo{position:absolute;border-radius:999px;border:2.5px solid var(--halo);transform:rotate(-8deg)}
.av .dot{position:absolute;width:12px;height:12px;border-radius:999px;inset-inline-start:-2px;bottom:-2px;
  border:2.5px solid var(--surface)}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;background:var(--surface);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 0 calc(14px + env(safe-area-inset-bottom));z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;padding:0 24px;
  color:#98A1BE;font-size:12px;font-weight:600}
nav button[aria-current="true"]{color:var(--ink)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(24,29,55,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;z-index:41;
  background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:20px;margin:0 0 4px}
.opt{width:100%;text-align:right;padding:16px;margin-bottom:10px;border-radius:18px;
  border:1px solid var(--line);background:#F8F9FE}
.opt b{display:block}
.box{background:#F8F9FE;border-radius:18px;padding:16px;margin-bottom:12px}
.label{font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 0 2px}
.big{width:100%;min-height:54px;border-radius:16px;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.big.dark{background:var(--ink);color:#fff}
.big.gold{background:var(--halo);color:#33270B}
.big.red{background:#FFE9EE;color:#BE3A5A}
.big[disabled]{background:#EFF1F8;color:#A0A8C4;cursor:default}
.line-item{display:flex;align-items:center;justify-content:space-between;padding:16px;margin-bottom:10px;
  border-radius:18px;border:1px solid var(--line);background:#F8F9FE}
.num{font-weight:700;color:var(--rose);direction:ltr}

/* full screens */
.full{position:fixed;inset:0;z-index:50;background:var(--night);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:48px 24px calc(40px + env(safe-area-inset-bottom))}
.pulse{position:relative;width:110px;height:110px;margin-bottom:32px}
.pulse .ring{position:absolute;inset:0;border-radius:999px;border:2px solid var(--halo);
  animation:ripple 1.8s ease-out infinite}
.pulse .ring:nth-child(2){animation-delay:.9s}
.pulse .core{position:absolute;inset:0;border-radius:999px;background:var(--halo);color:#33270B;
  display:grid;place-items:center}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.call-face{width:96px;height:96px;border-radius:32px;display:grid;place-items:center;font-size:40px;
  font-weight:700;margin-bottom:20px;background:rgba(255,255,255,.18)}
.guide{background:rgba(255,255,255,.08);border-radius:18px;padding:16px;text-align:right;margin-top:32px;width:100%}
.call-btns{display:flex;align-items:center;justify-content:center;gap:16px}
.circ{width:60px;height:60px;border-radius:999px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.circ.end{width:72px;height:72px;background:var(--rose)}
.transfer{width:100%;min-height:48px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;
  font-weight:600;font-size:14px;margin-bottom:12px}

/* me */
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;
  padding:0 16px;border-radius:18px;background:#F2F4FB;text-align:right}
.toggle[aria-pressed="true"]{background:#FFF4E0}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:#C7CDE2;flex:none;transition:background .2s}
.switch b{position:absolute;width:24px;height:24px;border-radius:999px;background:#fff;top:3px;
  inset-inline-start:3px;transition:inset-inline-start .2s}
.toggle[aria-pressed="true"] .switch{background:var(--halo)}
.toggle[aria-pressed="true"] .switch b{inset-inline-start:25px}
.tile{width:100%;display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:10px;text-align:right;
  background:var(--surface);border:1px solid var(--line);border-radius:18px}
.tile .ic{width:42px;height:42px;border-radius:14px;background:#F2F4FB;display:grid;place-items:center;flex:none}


/* learn cards */
.learn-section{margin:18px 0 8px}
.learn-title{font-size:20px;margin:0 0 4px}
.learn-grid{display:grid;gap:10px;margin-top:12px}
.learn-card{width:100%;text-align:right;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.learn-card .learn-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.learn-card b{display:block;font-size:15px;margin-bottom:2px}
.learn-card span{display:block}
.learn-body{line-height:1.72}
.learn-body h4{font-size:16px;margin:18px 0 6px}
.learn-body h4:first-child{margin-top:0}
.learn-body p{margin:0 0 10px}
.learn-body ul{margin:6px 0 0;padding-inline-start:20px}
.learn-body li{margin-bottom:7px}
.learn-quote{background:#FFF8E9;border:1px solid #F3DFAC;border-radius:16px;padding:14px;margin-top:14px;font-weight:600}

.disclaimer{font-size:12px;text-align:center;color:#8B94B8;margin:8px 0 24px;line-height:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

  if (id==="sharing") return '<h3 class="display">כשקשה לשתף</h3>'+
    '<div class="learn-body small muted" style="margin-top:12px">'+
    '<p>ניכור הוא התחושה שאתה ליד אנשים — אבל לא באמת איתם. שאתה רואה את העולם מבחוץ, ואף אחד לא באמת יודע מה קורה אצלך בפנים.</p>'+
    '<h4 style="color:var(--ink)">למה בדיכאון מרגישים כל כך לבד?</h4>'+
    '<p>כשאנחנו בדיכאון או במצוקה, קל להרגיש שאף אחד לא יבין, שלא כדאי להכביד, או שאין טעם להסביר. לפעמים אנחנו גם נסגרים דווקא ברגע שבו אנחנו הכי זקוקים לקשר.</p>'+
    '<h4 style="color:var(--ink)">אבל יש מי שמסוגל להזדהות</h4>'+
    '<p>לפעמים האדם שהכי יכול להבין הוא דווקא מי שכבר היה במקום דומה. לא כדי לתת פתרונות, אלא כדי להגיד: אני מכיר את התחושה הזאת. אני נשאר כאן איתך.</p>'+
    '<div class="learn-quote" style="color:var(--ink)">לא חייבים לספר הכול. לפעמים מספיק להתחיל במשפט אחד: “קשה לי עכשיו”.</div></div>';

  if (id==="selfworth") return '<h3 class="display">למה כולם מסתדרים ורק אני לא?</h3>'+

    '<p>אחת התחושות הכואבות ביותר היא להסתכל סביב ולחשוב שלכולם יש מפה ורק לך אין. אחרים נראים כאילו הם יודעים איך לעבוד, לאהוב, להתחבר, להתקדם ולהחזיק את עצמם — ואתה מרגיש תקוע, לא מובן, או תמיד צעד מאחור.</p>'+

    '<p>ביקורת עצמית יכולה להישמע כמו ניסיון להשתפר, אבל כשהיא קבועה היא שוחקת. אם כל טעות הופכת ל“אני כישלון”, כל דחייה ל“אף אחד לא ירצה אותי”, וכל תקופה קשה ל“ככה יהיו החיים שלי תמיד” — המוח מתחיל להתייחס לפרשנות כאילו היא עובדה.</p>'+
    '<h4 style="color:var(--ink)">ומה לגבי אהבה עצמית?</h4>'+
    '<p>המשפט “אם לא אוהב את עצמי לא אוכל לאהוב אחרים” מבטא רעיון חשוב: היחס שלנו לעצמנו משפיע מאוד על הדרך שבה אנחנו נכנסים לקשר. כשאנחנו תלויים לחלוטין באישור מבחוץ כדי להרגיש בעלי ערך, כל ריחוק קטן עלול להרגיש כמו איום. אהבה עצמית לא אומרת לחשוב שאתה מושלם — אלא להיות מסוגל להישאר בצד שלך גם כשאתה מבולבל, נכשל או מפחד.</p>'+
    '<div class="learn-quote" style="color:var(--ink)">אם לא אוהב את עצמי לא אוכל לאהוב אחרים.</div>'+
    '<h4 style="color:var(--ink)">אז מה עושים עם התחושה הזאת?</h4>'+
    '<p>לא צריך לפתור את כל החיים בבת אחת. אפשר להתחיל מלדבר עם אדם אחד בלי להציג גרסה “מסודרת” של עצמך. לשים לב מתי אתה משווה את מאחורי הקלעים שלך לבמה של אחרים. ולהחליף את השאלה “מה לא בסדר איתי?” בשאלה קצת יותר מועילה: “מה כואב לי, ומה אני צריך עכשיו?”</p>'+
    '<div class="learn-quote" style="color:var(--ink)">אתה לא חייב להיות במקום שבו אחרים נמצאים. אתה צריך להתחיל מהמקום שבו אתה נמצא.</div></div>';

  return '<h3 class="display">חשיבות הקהילה</h3>'+
    '<div class="learn-body small muted" style="margin-top:12px">'+
    '<p>אנחנו לא אמורים לעבור הכול לבד. קהילה היא לא רק קבוצה של אנשים — היא הידיעה שיש מי שרואה אותך, מי שמקשיב לך, ומי שמוכן להישאר גם כשאין תשובה מהירה.</p>'+
    '<h4 style="color:var(--ink)">כשמתאחדים, דברים מתחילים לזוז</h4>'+
    '<p>אנשים שעברו כאב, החלמה, אובדן, חרדה, התמכרות או בדידות יכולים להפוך את הניסיון שלהם לכוח עבור מישהו אחר. כל שיחה כזאת מזכירה לנו שאנחנו לא לבד.</p>'+
    '<div class="learn-quote" style="color:var(--ink)">מגיע לנו לחיות. מגיע לנו להגשים. מגיע לנו להרגיש שוב את האושר שכבר כמעט שכחנו איך הוא מרגיש. ואם נעשה את זה ביחד — נוכל לעשות דברים מדהימים.</div></div>';
}

function sheetAfter(){
  var p = byId(S.afterId); if(!p) return "";
  if (S.afterSent){
    return '<div style="text-align:center;padding:8px 0">'+
      '<div style="width:52px;height:52px;border-radius:999px;background:#E4F6EF;color:var(--grass);'+
        'display:grid;place-items:center;margin:0 auto 12px">'+ic('check',26)+'</div>'+
      '<h3 class="display">תודה. ההילה נשארת דלוקה.</h3>'+
      '<p class="small muted" style="margin:4px 0 16px">אפשר לחזור לכאן בכל שעה, גם ב-4 לפנות בוקר.</p>'+
      '<button class="big dark press" data-act="close">סגירה</button></div>';
  }
  var opts = ["עזר לי","בסדר","פחות התאים"].map(function(x){
    return '<button class="soft" data-act="rate" style="flex:1;min-height:52px;border-radius:16px;'+
      'background:#F2F4FB;font-weight:600;font-size:14px">'+x+'</button>';
  }).join("");
  return '<h3 class="display">איך היה עם '+esc(p.name)+'?</h3>'+
    '<p class="small muted" style="margin:0 0 16px">אנונימי. עוזר לנו לשמור על איכות ההקשבה.</p>'+
    '<div style="display:flex;gap:8px;margin-bottom:12px">'+opts+'</div>'+
    '<button class="soft small muted" data-act="rate" style="width:100%;min-height:44px">'+
      'דיווח על התנהגות לא ראויה</button>';
}

function sheetHTML(){
  if (!S.sheet) return "";
  var body = S.sheet==="triage" ? sheetTriage()
    : S.sheet==="crisis" ? sheetCrisis()
    : S.sheet==="emergency" ? sheetEmergency()
    : S.sheet==="profile" ? sheetProfile()
    : S.sheet==="after" ? sheetAfter()
    : S.sheet==="learn" ? sheetLearn() : "";
  return '<div class="overlay" data-act="close"></div>'+
    '<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+body+'</div>';
}

/* --------------------------- full screens ------------------------- */
function matchingHTML(){
  var t = S.matching.target ? byId(S.matching.target) : null;
  var sub = S.matching.serious ? "איש מקצוע תורן עונה מיד"
    : (t ? "בדרך כלל עונים תוך שניות" : WAIT[S.wait]);
  return '<div class="full"><div class="pulse"><span class="ring"></span><span class="ring"></span>'+
    '<span class="core">'+ic('phone',36)+'</span></div>'+
    '<h3 class="display" style="font-size:22px">'+(t?'מצלצלים ל'+esc(t.name)+'…':'מחברים אותך…')+'</h3>'+
    '<p id="wait" class="small" style="color:#B4BBE6;margin:8px 0 0">'+esc(sub)+'</p></div>';
}

function callHTML(){
  var p = byId(S.callId);
  var s = Math.floor((Date.now()-S.callStart)/1000);
  var mm = String(Math.floor(s/60)); while(mm.length<2) mm="0"+mm;
  var ss = String(s%60); while(ss.length<2) ss="0"+ss;
  return '<div class="full" style="justify-content:space-between">'+
    '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%">'+
      '<div class="call-face">'+esc(p.ini)+'</div>'+
      '<h3 class="display" style="font-size:24px">'+esc(p.name)+'</h3>'+
      '<p class="small" style="color:#B4BBE6;margin:4px 0 0">'+esc(p.been)+'</p>'+
      '<p id="timer" class="small" style="color:var(--halo);direction:ltr;margin:12px 0 0">'+mm+':'+ss+'</p>'+
      '<div class="guide"><p class="xs" style="color:var(--halo);font-weight:600;margin:0 0 4px">למאזין/ה</p>'+
        '<p class="small" style="color:#D5DAF2;margin:0;line-height:1.6">להקשיב, לא לייעץ. אם עולה סכנה — '+
        'לוחצים על "העברה לאיש מקצוע" ומדריך תורן נכנס לשיחה.</p></div>'+
    '</div>'+
    '<div style="width:100%">'+
      '<button class="transfer press" data-act="sheet" data-id="emergency">העברה לאיש מקצוע תורן</button>'+
      '<div class="call-btns">'+
        '<button class="circ press" data-act="mute" aria-label="'+(S.muted?"ביטול השתקה":"השתקה")+'">'+
          ic(S.muted?'micOff':'mic',24)+'</button>'+
        '<button class="circ end press" data-act="end" aria-label="סיום שיחה">'+
          ic('phone',28,'style="transform:rotate(135deg)"')+'</button>'+
      '</div></div></div>';
}

function navHTML(){
  return '<nav>'+[["home","home","בית"],["chats","msg","שיחות"],["me","user","אני"]].map(function(t){
    return '<button data-act="tab" data-id="'+t[0]+'" aria-current="'+(S.tab===t[0])+'">'+
      ic(t[1],22)+'<span>'+t[2]+'</span></button>';
  }).join("")+'</nav>';
}

/* ----------------------------- render ---------------------------- */
function render(){
  var screen = S.tab==="home" ? homeScreen() : S.tab==="chats" ? chatsScreen() : meScreen();
  document.getElementById("app").innerHTML =
    '<main class="wrap">'+screen+'</main>'+navHTML()+sheetHTML()+
    (S.matching?matchingHTML():"")+(S.callId?callHTML():"");
}

/* ---------------------------- behaviour --------------------------- */
document.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  if (el.tagName === "A") return; // hotline links dial out

  if (act==="tab"){ S.tab = id; S.sheet=null; }
  else if (act==="filter"){ S.filter = id; }
  else if (act==="sheet"){ S.sheet = id; }
  else if (act==="close"){ S.sheet=null; S.afterId=null; S.afterSent=false; S.learnId=null; }
  else if (act==="open"){ S.profileId = +id; S.sheet="profile"; }
  else if (act==="hero"){ S.sheet="triage"; }
  else if (act==="learn"){ S.learnId=id; S.sheet="learn"; }
  else if (act==="triage"){
    S.sheet=null;
    if (id==="crisis"){ S.sheet="crisis"; }
    else { startMatch(null,false); }
  }
  else if (act==="crisis-pro"){
    S.sheet=null;
    var pro = ANGELS.filter(function(p){return p.kind==="pro";})[0];
    startMatch(pro.id,true);
  }
  else if (act==="call"){ S.sheet=null; startMatch(+id,false); }
  else if (act==="mute"){ S.muted = !S.muted; }
  else if (act==="end"){ endCall(); }
  else if (act==="rate"){ S.afterSent = true; }
  else if (act==="toggle"){ S.available = !S.available; }
  render();
});

function startMatch(targetId, serious){
  S.matching = {target:targetId, serious:!!serious};
  S.wait = 0;
  render();
  setTimeout(function(){
    if (!S.matching) return;
    var t = S.matching.target || ANGELS.filter(function(p){return p.online && p.kind!=="pro";})[0].id;
    S.matching = null; S.callId = t; S.callStart = Date.now(); S.muted = false;
    render();
  }, 2000);
}

function endCall(){
  S.afterId = S.callId; S.afterSent = false;
  S.callId = null; S.sheet = "after";
}

/* light-touch timers: update single nodes, never re-render the whole app */
setInterval(function(){
  var t = document.getElementById("timer");
  if (S.callId && t){
    var s = Math.floor((Date.now()-S.callStart)/1000);
    var mm = String(Math.floor(s/60)); while(mm.length<2) mm="0"+mm;
    var ss = String(s%60); while(ss.length<2) ss="0"+ss;
    t.textContent = mm+":"+ss;
  }
  var w = document.getElementById("wait");
  if (S.matching && !S.matching.target && !S.matching.serious && w){
    S.wait = (S.wait+1) % WAIT.length;
    w.textContent = WAIT[S.wait];
  }
}, 1000);

setInterval(function(){
  S.tick = (S.tick+1) % TICKER.length;
  var el = document.getElementById("ticker");
  if (el){ el.textContent = TICKER[S.tick]; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; }
}, 5000);

document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && S.sheet){ S.sheet=null; S.afterId=null; S.afterSent=false; render(); }
});

render();
</script>
